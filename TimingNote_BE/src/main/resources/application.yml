spring:
  application:
    name: TimingNote

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
    connection-timeout: 2s
    socket-timeout: 5s

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
  internal:
    secret: ${AI_INTERNAL_SECRET:dev-secret}

kakao:
  api:
    key: ${KAKAO_API_KEY:}

google:
  places:
    api:
      key: ${GOOGLE_PLACES_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
  # Windows/Tomcat 환경에서 한글 query string이 깨지는 현상 방지.
  # /api/v1/todos/search?q=약국 같은 한국어 검색어가 ES로 그대로 전달되도록 강제.
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

swagger:
  server-url: ${SWAGGER_SERVER_URL:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  device-secret:
    pepper: ${DEVICE_SECRET_PEPPER:local-dev-only-change-this-pepper}


cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}

app:
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    max-upload-size-bytes: 20971520
    original-prefix: ${AWS_S3_ORIGINAL_PREFIX:uploads/original}
    resized-prefix: ${AWS_S3_RESIZED_PREFIX:uploads/resized}
    thumbnail-prefix: ${AWS_S3_THUMBNAIL_PREFIX:uploads/thumbnail}
  rabbitmq:
    geofence-slot-exchange: geofence.slot.exchange
    geofence-slot-recalculate-queue: geofence.slot.recalculate
    geofence-slot-routing-key: geofence.slot.recalculate
    geofence-slot-dlq: geofence.slot.recalculate.dlq
    geofence-slot-dlq-routing-key: geofence.slot.recalculate.dlq
    geofence-slot-concurrency: 2
    geofence-slot-max-concurrency: 6
    geofence-slot-prefetch: 20
    geofence-slot-retry-max-attempts: 3
    geofence-slot-retry-initial-interval-ms: 1000
    geofence-slot-retry-max-interval-ms: 10000
    geofence-slot-retry-multiplier: 2.0
  outbox:
    geofence:
      relay-fixed-delay-ms: 5000
      batch-size: 100
      default-max-retry-count: 5
      retry-base-seconds: 5
      retry-max-seconds: 300
  search:
    todo-index: ${TODO_SEARCH_INDEX:todos}
    enabled: ${SEARCH_ENABLED:true}
    admin-secret: ${ADMIN_INTERNAL_SECRET:}

firebase:
  admin-sdk-path: ${FIREBASE_ACCOUNT_PATH}

# 환경변수 LOG_LEVEL_APP / LOG_LEVEL_ROOT 로 운영 중 오버라이드.
# 프로파일별 yml에서 더 세부 키를 추가하면 이 디폴트보다 우선 적용됨.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.timingnote: ${LOG_LEVEL_APP:INFO}
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN


