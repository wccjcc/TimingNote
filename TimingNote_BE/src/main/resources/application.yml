spring:
  application:
    name: TimingNote

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
  internal:
    secret: ${AI_INTERNAL_SECRET:dev-secret}

kakao:
  api:
    key: ${KAKAO_API_KEY:}

google:
  places:
    api:
      key: ${GOOGLE_PLACES_API_KEY:}

server:
  port: ${SERVER_PORT:8080}

swagger:
  server-url: ${SWAGGER_SERVER_URL:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  device-secret:
    pepper: ${DEVICE_SECRET_PEPPER:local-dev-only-change-this-pepper}
