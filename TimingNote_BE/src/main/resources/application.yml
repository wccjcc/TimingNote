spring:
  application:
    name: TimingNote

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
  internal:
    secret: ${AI_INTERNAL_SECRET:dev-secret}

kakao:
  api:
    key: ${KAKAO_API_KEY:}

google:
  places:
    api:
      key: ${GOOGLE_PLACES_API_KEY:}

server:
  port: ${SERVER_PORT:8080}

swagger:
  server-url: ${SWAGGER_SERVER_URL:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  device-secret:
    pepper: ${DEVICE_SECRET_PEPPER:local-dev-only-change-this-pepper}


cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}

app:
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    original-prefix: ${AWS_S3_ORIGINAL_PREFIX:uploads/original}
    resized-prefix: ${AWS_S3_RESIZED_PREFIX:uploads/resized}
    thumbnail-prefix: ${AWS_S3_THUMBNAIL_PREFIX:uploads/thumbnail}

firebase:
  admin-sdk-path: ${FIREBASE_ACCOUNT_PATH}


