spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Local development convenience mode:
  # entity changes are reflected automatically without migration SQL.
  flyway:
    enabled: false

  # local 프로파일에서는 호스트의 9200 포트로 직접 접근.
  # .env의 ELASTICSEARCH_HOST=elasticsearch는 docker-compose.app.yml 컨테이너 통신용이라
  # 호스트에서 직접 bootRun 시 hostname 'elasticsearch'가 풀리지 않음 → 강제 오버라이드.
  elasticsearch:
    uris: http://localhost:9200

# 로컬 개발 편의: 앱 패키지는 DEBUG, 외부 라이브러리 noise는 그대로 INFO.
# application.yml의 환경변수 디폴트보다 프로파일 yml이 우선이라 LOG_LEVEL_APP 설정 없이도 DEBUG 적용됨.
logging:
  level:
    com.timingnote: DEBUG
    org.springframework.web: INFO
