# 실행
#  docker-compose -f docker-compose.local.yml up -d
# 중지
#  docker-compose -f docker-compose.local.yml down

services:
  # Redis Stack: Redis 서버 + Redis Insight UI (8001 포트) 포함
  redis:
    image: redis/redis-stack:latest
    container_name: timingnote-redis
    ports:
      - "6379:6379" # Redis 서버 포트
      - "8001:8001" # Redis Insight UI 포트
    environment:
      REDIS_ARGS: --appendonly yes
    volumes:
      - redis-data:/data
    restart: always

  # RabbitMQ Management: 메시지 브로커 + 관리자 UI (15672 포트) 포함
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: timingnote-rabbitmq
    ports:
      - "5672:5672"   # AMQP 프로토콜 포트
      - "15672:15672" # 관리자 웹 UI 포트
    environment:
      # 초기 계정 설정 (로컬 환경이므로 기본값 사용 권장)
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
  # PostgreSQL 17 (pgvector 포함) + PostGIS 설치 환경
  db:
    build: ./infra/postgres  # Dockerfile이 있는 경로로 수정
    container_name: timingnote-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # 현재 폴더(루트) 기준 infra/postgres/data 폴더에 저장
      - ./infra/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/initdb.d:/docker-entrypoint-initdb.d
    restart: always

  # Elasticsearch 8.14.3 + Nori (한국어 형태소 분석) - 할 일 검색용
  elasticsearch:
    build:
      context: ./infra/elasticsearch
      dockerfile: Dockerfile
    container_name: timingnote-elasticsearch-local
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"   # ulimits/memlock 환경 차이 흡수 (single-node 안정성)
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: always

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
  elasticsearch-data:

